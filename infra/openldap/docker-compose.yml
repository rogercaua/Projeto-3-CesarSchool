services:
  openldap:
    image: bitnamilegacy/openldap:latest
    restart: unless-stopped
    environment:
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?defina LDAP_ADMIN_PASSWORD no .env}
      LDAP_ROOT: ${LDAP_BASE_DN:?defina LDAP_BASE_DN no .env}
      LDAP_SKIP_DEFAULT_TREE: "yes"
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      LDAP_ENABLE_TLS: "no"
    ports:
      - "389:1389"
    volumes:
      - ldap_data:/bitnami/openldap
      - ./seed:/ldifs:ro

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    restart: unless-stopped
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      - openldap

volumes:
  ldap_data:
