<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · GovCadastral</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-wrap">
      <div class="login-head">
        <div class="login-logo" data-icon="shield"></div>
        <h1>GovCadastral</h1>
        <p class="s1">Plataforma de Governança Cadastral</p>
        <p class="s2">Secretaria de Saúde do Recife · Estratégia Saúde da Família</p>
      </div>

      <div class="login-card">
        <div class="login-banner"><span class="live-dot"></span>Autenticação via Keycloak · SSO Municipal</div>
        <form class="login-body" id="form-login" autocomplete="off">
          <div>
            <label class="lbl" for="email">Usuário (e-mail institucional)</label>
            <input type="email" id="email" required>
          </div>
          <div>
            <label class="lbl" for="senha">Senha</label>
            <input type="password" id="senha" placeholder="••••••••">
          </div>
          <div>
            <label class="lbl">Simular perfil (modo desenvolvimento)</label>
            <div class="role-grid" id="perfis"></div>
            <p class="field-msg">No modo dev a senha não é validada; o perfil escolhido vira o papel do token.</p>
          </div>
          <div class="form-error" id="erro" hidden></div>
          <button type="submit" class="btn btn-primary" id="entrar">Entrar com SSO</button>
        </form>
      </div>
      <p class="login-foot">Acesso restrito a servidores autorizados · SMS Recife</p>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
