<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Solicitação · GovCadastral</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main">
      <header class="topbar">
        <div class="topbar-title">
          <a class="back" href="dashboard.html" id="voltar" aria-label="Voltar">
            <span data-icon="chevron" data-icon-class="rot180"></span>
          </a>
          <div class="topbar-divider"></div>
          <div>
            <h1 id="titulo">Nova Solicitação</h1>
            <p id="subtitulo">Inclusão, Alteração, Inativação ou Reativação de cadastro</p>
          </div>
        </div>
      </header>

      <div class="content narrow" id="conteudo">
        <div class="banner" id="devolucao" hidden></div>

        <section class="card pad">
          <label class="lbl">Tipo de Solicitação <span class="req">*</span></label>
          <div class="type-picker" id="tipos">
            <button type="button" data-tipo="INCLUSAO">Inclusão</button>
            <button type="button" data-tipo="ALTERACAO">Alteração</button>
            <button type="button" data-tipo="INATIVACAO">Inativação</button>
            <button type="button" data-tipo="REATIVACAO">Reativação</button>
          </div>
        </section>

        <section class="card pad form-stack">
          <h3 class="form-card-title">Dados da Unidade</h3>

          <div id="bloco-unidade">
            <label class="lbl" for="f-unidade">Unidade de referência <span class="req">*</span></label>
            <select id="f-unidade"><option value="">Selecione a unidade...</option></select>
          </div>

          <div class="grid-2">
            <div>
              <label class="lbl" for="f-nome">Nome da Unidade <span class="req">*</span></label>
              <input type="text" id="f-nome" placeholder="Ex: UBS Vila Madalena" maxlength="150">
            </div>
            <div>
              <label class="lbl" for="f-tipo">Tipo de Unidade <span class="req">*</span></label>
              <select id="f-tipo"></select>
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label class="lbl" for="f-distrito">Distrito <span class="req">*</span></label>
              <select id="f-distrito"></select>
            </div>
            <div>
              <label class="lbl" for="f-cnes">Código CNES</label>
              <div class="inline-field">
                <input type="text" id="f-cnes" class="mono" placeholder="Ex: 2077604" inputmode="numeric" maxlength="7">
                <button type="button" class="btn btn-ghost" id="btn-cnes">Buscar</button>
              </div>
              <p class="field-msg" id="cnes-msg" hidden></p>
            </div>
          </div>

          <label class="check-card" id="card-semcnes">
            <input type="checkbox" id="f-semcnes">
            <div>
              <div class="t">Unidade sem código CNES vinculado</div>
              <div class="d">Marque esta opção caso a unidade ainda não possua CNES na base federal.</div>
            </div>
            <span data-icon="alert" id="ic-semcnes" hidden></span>
          </label>

          <div class="grid-2" id="bloco-qtd">
            <div>
              <label class="lbl" for="f-eq">Qtd. Equipamentos</label>
              <input type="number" id="f-eq" class="mono" value="0" min="0">
            </div>
            <div>
              <label class="lbl" for="f-serv">Qtd. Serviços</label>
              <input type="number" id="f-serv" class="mono" value="0" min="0">
            </div>
          </div>
        </section>

        <section class="card pad">
          <label class="lbl" for="f-just">Justificativa da Solicitação <span class="req">*</span></label>
          <textarea id="f-just" rows="3" placeholder="Descreva o motivo e a fundamentação da solicitação..."></textarea>
        </section>

        <div class="form-error" id="erro" hidden></div>
        <div class="form-actions">
          <button type="button" class="btn btn-primary" id="enviar">Enviar Solicitação</button>
          <a class="btn btn-ghost" id="cancelar" href="dashboard.html">Cancelar</a>
        </div>
      </div>
    </main>
  </div>
  <div id="toast-root"></div>
  <script type="module" src="js/nova-solicitacao.js"></script>
</body>
</html>
