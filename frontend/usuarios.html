<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários · GovCadastral</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main">
      <header class="topbar">
        <div>
          <h1>Usuários</h1>
          <p>Usuários locais do sistema. Os papéis vêm do login (token), não deste cadastro.</p>
        </div>
      </header>

      <div class="content">
        <section class="card pad">
          <form id="form-novo" autocomplete="off" class="form-stack">
            <div class="grid-2">
              <div><label class="lbl" for="f-nome">Nome <span class="req">*</span></label><input type="text" id="f-nome" maxlength="150" placeholder="Ex: Ana Lima"></div>
              <div><label class="lbl" for="f-email">E-mail <span class="req">*</span></label><input type="email" id="f-email" maxlength="150" placeholder="ana@recife.gov.br"></div>
            </div>
            <div class="form-actions"><button type="submit" class="btn btn-primary" id="adicionar"><span data-icon="plus"></span>Adicionar usuário</button>
              <span class="xs muted">No login simulado, quem entrar com este e-mail usa este cadastro.</span></div>
            <p class="field-msg bad" id="erro" hidden></p>
          </form>
        </section>

        <section class="card">
          <div class="card-head"><h3>Usuários cadastrados</h3>
            <div class="search-box" style="max-width: 280px"><span data-icon="search"></span><input type="text" id="f-busca" placeholder="Buscar por nome ou e-mail..."></div>
            <span class="mono xs muted" id="contagem"></span></div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Identificador</th><th>Ações</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast-root"></div>
  <script type="module" src="js/usuarios.js"></script>
</body>
</html>
